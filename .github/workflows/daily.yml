name: Actualizar pronosticos
on:
  schedule:
    - cron: '17 * * * *'   # cada hora (minuto 17)
  workflow_dispatch:       # permite ejecutarlo a mano
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python build.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "Actualizacion diaria" || echo "sin cambios"
          git push
